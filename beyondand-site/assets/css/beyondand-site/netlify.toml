# Beyond& slim — Netlify config

[build]
  publish = "."

[[redirects]]
  from = "/sectors/*"
  to = "https://al-fas-preview.netlify.app/sectors/:splat"
  status = 301

[[redirects]]
  from = "/case-studies/*"
  to = "https://al-fas-preview.netlify.app/case-studies/:splat"
  status = 301

[[redirects]]
  from = "/diagnostic"
  to = "https://al-fas-preview.netlify.app/diagnostic/?source=beyondand"
  status = 302

[[redirects]]
  from = "/rfp"
  to = "https://al-fas-preview.netlify.app/rfp/?source=beyondand"
  status = 302

# Catch-all 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
